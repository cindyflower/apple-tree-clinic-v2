# Deploy to Cloudflare Pages (*.pages.dev) for AB Test preview.
# Do NOT bind www.drappletree.com.tw until launch — see docs/cloudflare-pages.md
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages (preview origin)
        run: pnpm run build:production
        env:
          # AB Test：canonical / sitemap 指向 *.pages.dev，不動正式網域
          VITE_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://apple-tree-clinic-v2.pages.dev' }}
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://apple-tree-clinic-v2.pages.dev' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'apple-tree-clinic-v2' }} --branch=main
