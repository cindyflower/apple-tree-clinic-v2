# Deploy to Cloudflare Pages (*.pages.dev) for AB Test preview.
# Do NOT bind www.drappletree.com.tw until launch — see docs/cloudflare-pages.md
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

# GitHub Actions runtime: opt into Node 24 (Node 20 deprecated on runners)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages (preview origin)
        run: pnpm run build:production
        env:
          # AB Test：canonical / sitemap 指向 *.pages.dev，不動正式網域
          VITE_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://apple-tree-clinic-v2.pages.dev' }}
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://apple-tree-clinic-v2.pages.dev' }}

      - name: Verify Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || (echo "::error::Missing or empty CLOUDFLARE_API_TOKEN in GitHub Actions secrets" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "::error::Missing or empty CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets" && exit 1)
          echo "Cloudflare secrets are set (values not printed)."

      - name: Deploy to Cloudflare Pages
        run: >
          pnpm exec wrangler pages deploy dist/public
          --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'apple-tree-clinic-v2' }}
          --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
